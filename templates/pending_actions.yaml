# pending_actions.yaml — 焦外事件记录层（触发式·初始模板）
# 与 scene_state 互补：scene_state=焦内·此处=焦外（facts 层）
# 场景初始化（init_scene.py）时复制为 worlds/{世界名}/scenes/{焦点场景}/pending_actions.yaml
# 焦外角色行动/状态/时段/结果/预计影响/揭示场景——有变化才写，禁止逐字复制 conflicts
# 字段规范：字段值 = 真实数据（非骨架占位）；条目结构 = 注释示例行（下方 # 块，复制即用）。

已完成: {}   # 已结算的焦外行动·按 PA-ID 归档—— (例: PA-01: 已完成)

