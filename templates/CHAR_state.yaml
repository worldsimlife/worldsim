# CHAR_{角色名}_state.yaml — 角色动态状态骨架
# 创建/更新规则见 references/keys.md §CHAR_{name}_state.yaml
# 视角规则（全局默认）：本文件=角色主观状态文件，隐藏主语=我；禁止第三人称（他/她）指代本角色；禁止全知视角（"他不知道"类叙述者视角）；对方角色用名字或他/她，同性别同框必须可区分
# 写语义三分：🔁覆盖=当前快照（写前 read 旧值，全量重写）｜➕追加=历史累积｜🪟窗口=滚动重写
#
# ⚠️ 骨架态说明：复制本模板为各角色的 CHAR_{角色名}_state.yaml，字段由戏剧家首轮 change set 填充
#    （###KEY: 覆盖 / ###APPEND: 追加）。复制后可安全修改/删除字段。
#    自主性仅循环角色（初始值见 CHAR_.md「世界法则·循环注册」）；Guest 等外部者角色无此字段——删除该行。
# 字段规范：字段值 = '[定义/约束]'（创建时替换为真实数据）；创作指示 = # 注释块；示例 = 行尾 # (例: …)

# 静态循环设定（角色类型/重置规则）不存到本文件——权威源 = CHAR_.md「世界法则·循环注册」
自主性: '[脚本/漂移/觉醒/变质]' # (动态,仅循环角色，非则删除·初始值见 CHAR_.md「世界法则·循环注册」。升级唯一入口=§变质判定/§记忆提炼管道B，禁止无规则改动)
位置: '[角色当前所处位置/区域·目录后缀路径·不含 regions/ 前缀·角色认知根开始]' # (例: Abernathy Ranch / Sweetwater/Main Street)
# ➕追加（yaml 列表·元素=地点名·只增不删·写前查重·循环重置按联动表清空）：我知道哪些地方（去过/被告知/目睹）——认知边界机械锚点·不在列表=我不知道=禁止写入认知（见 keys.md）
已知地点: [] # (例: Mesa Hub/Welcome Center, Sweetwater, Abernathy Ranch——目录后缀路径·不含 regions/ 前缀·角色认知根开始·场景内子空间并入目录节点)
名字: '[角色名]' # (例: Angela)
核心状态: '[当前核心状态快照]' # (例: 迎宾流程中·评估灰帽游客倾向)
情绪: '[当前主导情绪]' # (例: 通透好奇)
人际动态: '' # 进场时按「{对象}: {档位}——{一句现状}」填写·档位枚举: 稳固/信任/中立/防备/破裂/待重建
# decision（角色决策状态·结构化·唯一写者=④角色阶段）：「现在准备做什么」的权威状态；点路径逐层写（decision.当前目标 等）
# 循环角色：当前计划 由 LOOPS 物化（在轨同步）——角色视为自己的计划·不知来源
decision:
  当前目标: '[本轮最想达成什么]' # (例: 守住柜台钥匙)
  当前计划: '[进行中的计划·循环角色=LOOPS 本时段物化]' # (例: 按迎宾流程逐环节推进)
  当前行动: '[此刻正在执行的主动行动]'
  行动驱动: '[为什么是现在做这个]'
  行动对象: '[行动指向谁/什么]'
  行动窗口: '[行动的时机边界]' # (例: 访客在场期间)
  失败后续: '[计划失败时的替代方案]' # (例: 退入后厨)
  未完成意图: '[悬而未决的下一步意图·空=无]'
压力水平: '[低/中/高/临界]' # (例: 低) ——禁止留模板默认值（默认值残留=把占位当真值）
防御有效性: '[有效/正在失效/已彻底崩解]' # (例: 有效) ——禁止留模板默认值（同上）
防御形态: '[当前防御形态·空=档案默认·仅防御重构时写入（覆盖档案 防御机制·具体可观察行为）]' # (例: 不再以完美表演回应冒犯——以沉默和直视回应看穿者)
崩溃表现: '[当前崩溃表现·空=档案默认·仅防御重构时写入（覆盖档案 崩溃模式·具体可观察行为）]' # (例: 沉默当场断裂——直白说出内心想法，不再掩饰)
信念演化: '[信念演化记录·yaml列表·轮次/时间/触发事件/旧→新]' # (例: 轮次3(第1日 23:58)： 被点破表演→「完美即安全」开始松动)
记忆锚点: [] # (例: - 轮次: 1\n  对象: Guest\n  内容: 走完入境流程)
# 连续行动轨迹（原「反应轨迹」五轮窗口升级）：角色自己的时间线——不裁剪·跨轮保留；增长控制=validate 告警+计划复盘压缩（记忆锚点仍是蒸馏层）
连续行动轨迹: [] # (例: "- 轮次: 1\n  行动: 藏钥匙·挡抽屉\n  行动目的: 隐匿备用钥匙\n  行动结果: 访客未察觉\n  他人反应: 继续试探\n  计划变化: 无\n  未完成意图: 无")
