# CHAR_{角色名}_state.yaml — 角色动态状态骨架
# 创建/更新规则见 references/keys.md §CHAR_{name}_state.yaml
# 视角规则（全局默认）：本文件=角色主观状态文件，隐藏主语=我；禁止第三人称（他/她）指代本角色；禁止全知视角（"他不知道"类叙述者视角）；对方角色用名字或他/她，同性别同框必须可区分
# 写语义三分：🔁覆盖=当前快照（写前 read 旧值，全量重写）｜➕追加=历史累积｜🪟窗口=滚动重写
#
# ⚠️ 骨架态说明：复制本模板为各角色的 CHAR_{角色名}_state.yaml，字段由戏剧家首轮 change set 填充
#    （###KEY: 覆盖 / ###APPEND: 追加）。复制后可安全修改/删除字段。
#    自主性仅循环角色（初始值见 CHAR_.md「世界法则·循环注册」）；Guest 等外部者角色无此字段——删除该行。
# 字段规范：字段值 = '[定义/约束]'（创建时替换为真实数据）；创作指示 = # 注释块；示例 = 行尾 # (例: …)

# 静态循环设定（角色类型/重置规则）不存到本文件——权威源 = CHAR_.md「世界法则·循环注册」
自主性: '[脚本/漂移/觉醒/变质]' # (动态,仅循环角色，非则删除·初始值见 CHAR_.md「世界法则·循环注册」。升级唯一入口=§变质判定/§记忆提炼管道B，禁止无规则改动)
位置: '[角色当前所处位置/区域]' # (例: Welcome Center·主厅)
# ➕追加（yaml 列表·元素=地点名·只增不删·写前查重·循环重置按联动表清空）：我知道哪些地方（去过/被告知/目睹）——认知边界机械锚点·不在列表=我不知道=禁止写入认知（见 keys.md）
已知地点: '[我知道哪些地方（去过/被告知/目睹）]' # (例: 入境长廊, 主厅, 更衣套房)
名字: '[角色名]' # (例: Angela)
核心状态: '[当前核心状态快照]' # (例: 迎宾流程中·评估灰帽游客倾向)
情绪: '[当前主导情绪]' # (例: 通透好奇)
人际动态: '[对在场角色的关系档位+态度。关系档位为枚举: 稳固/信任/中立/防备/破裂/待重建]' # (例: 'Angela: 中立——她在引导我走完流程')
决策状态: '[当前决策/行动方向]' # (例: 按标准迎宾流程推进)
压力水平: '[低/中/高/临界]' # (例: 低) ——禁止留模板默认值（默认值残留=把占位当真值）
防御有效性: '[有效/正在失效/已彻底崩解]' # (例: 有效) ——禁止留模板默认值（同上）
信念演化: '[信念演化记录·yaml列表·轮次/时间/触发事件/旧→新]' # (例: 轮次3(第1日 23:58)： 被点破表演→「完美即安全」开始松动)
记忆锚点: '[记忆锚点列表·单条≤100字·同类融合]' # (例: - 轮次: 1\n  对象: Guest\n  内容: 走完入境流程)
反应轨迹: '[最近5轮动作序列·窗口滚动]' # (例: 第N轮(时间): 动作序列 | 方向: 本轮总结)
