# world_state.yaml — 世界级动态状态模板（初始态·唯一来源）
# ⚠ 首次启动物化时从本模板复制为 worlds/{世界名}/world_state.yaml，
#   此后运行中由每轮 change set 覆盖更新；键表见 references/keys.md §world_state.yaml。
# ⚠ 焦点场景 = 顶层第一行·唯一权威源（不再使用 .active 文件；INDEX 状态列仅为展示）
# 下方默认值 = 全新启动态；运行中示例以注释形式保留。

焦点场景: ''
轮次: 0

时间:
  基准时间: 未开始
  具体时间: 未开始
  时间流速比: "1:1"
  前情描述: 世界刚创建·尚未开场景·等待戏剧家首轮确立起点

地点:
  当前区域: 未探索
  已探索区域: []

外部倒计时: {}
# 外部倒计时（倒计时协议·确立即登记：事件确立/感知出现/外部导入三选一触发；周期事件[如每日重置]到期后自动重建下一期；剩余时间随叙事时间推进递减；到期执行后果并移除）:
#   CD-001:
#     威胁: 威胁名称
#     剩余时间: "14-20分钟"    # 只放数值
#     说明: ≤80字威胁后果
#     感知者: 能感知该威胁的角色（判定=自主性档位+认知边界）——未感知角色不产生压力反应（但倒计时照常登记走表）

全局标记: {}
# 全局标记:
#   标记名: 结论性状态（≤60字，角色状态不写这里）
# 读：世界层结论不直接进角色状态——戏剧家逐角色检查感知后，感知者更新 CHAR_state

时间线: {}
# 时间线:
#   S01-场景名:
#     时间: 场景基准时间
#     事件: '· 关键转折1（每条≤120字）
#       · 关键转折2'
# 每场景一条摘要（≤3 关键转折点·每条≤120字·事件内部禁止用·）；覆盖重写：写前先压缩旧条目；明细记在 scene_state.yaml 场景时间线

叙事约定: ""
# 叙事约定（每轮必读·各世界不同）：首次启动时按世界设定填写，如 POV 视角/叙事人称/认知边界。
# 示例见 worlds/westworld/world_state.yaml。
