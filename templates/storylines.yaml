# 边界：结构蓝图，不含当前拍（指针权威=direction.yaml）；不碰实时演出/角色行动/CT 状态。
# 弧线声明权威=SETTING.md「故事弧线」——本文件只记运行时归位·不复制静态声明（防镜像）。
# 字段规范：字段值 = '[定义/约束]'（创建时替换为真实数据）；示例 = 行尾 # (例: …)
# 结构参考：references/beat_structure.md（三幕十五拍宏观骨架）；键表见 references/keys.md §storylines.yaml
