# foreshadow.yaml — 伏笔登记（动态记录·故事契约层·可选）
# 规则全文见 references/foreshadow.md；键表见 references/keys.md §foreshadow.yaml
# 启用方式：登记第一条时若文件不存在 → 按本模板创建（触发式·不随 create_world 预置）
# 字段规范：字段值 = '[定义/约束]'（创建时替换为真实数据）；示例 = 行尾 # (例: …)
# 收录触发：①新伏笔种下时登记一条（状态=待回收）②伏笔回收时更新 回收+状态（关键节点·非逐轮）
# 写语义：➕追加（###APPEND: 伏笔·按 线索 查重）· 覆盖/清空走 ###KEY: · 不参与循环重置
# validate 机械检查：倒置（回收<种下·硬错）/ 超时（待回收>20轮·警告）/ 状态枚举（警告）

伏笔:
  - 线索: '[伏笔内容·≤40字]' # (例: 旧照片上的陌生人影)
    种下: '[种下时全局轮次·单调递增·机械检查基准]' # (例: 25)
    时间: '[种下时叙事时间·audit 人工核对错位·不程序比较]' # (例: 第1日 14:20)
    回收: '[回收时全局轮次·待回收/废弃留空]' # (例: 30)
    状态: '[待回收/已回收/废弃]' # (例: 待回收)
