# world_map.yaml — 世界地图（迷雾制·可选增强层）
# 多层结构：大区 → 地点 → 子空间（层级键 = 子区域，可继续嵌套）。
# 初始为空：一片迷雾。随叙事推进逐步登记「已拨开的迷雾」；缺失不影响运行。
# 登记时机见 references/scene_management.md §世界地图协议；地名参照 SETTING.md → ## 地理。
# 字段规范：字段值 = 真实数据（非骨架占位）；结构示例 = 注释示例行（下方 # 块，复制即用）。

已探索区域: {}   # 已拨开迷雾的区域结构·大区→地点→子空间嵌套—— (例: 见下方注释示例)
# 已探索区域:
#   旧城区:                       # 大区/地点（任意层级）
#     类型: EXT                   # INT / EXT
#     方位: 相对参照点的位置描述
#     连接: 可达区域名（逗号分隔，可指向未登记迷雾区）
#     发现于: S01                 # 首次到达的场景短 ID
#     备注: '≤80字发现所得'
#     档案: regions/旧城区/REGION.md   # 区域静态档案指针（可选·有则登记时从档案复制 类型/方位/连接/子区域）
#     子区域:                     # 下层空间（层级键，可继续嵌套）
#       正街:
#         类型: EXT
#         方位: 东西主轴线
#         发现于: S01
#         子区域:
#           城门口:
#             类型: EXT
#             方位: 正街西端
#             发现于: S01
