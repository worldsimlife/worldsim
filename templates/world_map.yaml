# world_map.yaml — 世界地图（镜像层·可选增强层）
# 有 regions/ 目录时：镜像层——节点/层级/类型/档案全部从目录树派生（validate 对账自动补全·禁止手写节点/指针）。
# 无 regions/ 目录时：迷雾制——初始为空，随叙事登记。
# 结构权威=regions/ 目录树；角色探索状态=CHAR_state 已知地点（后缀路径·本文件不存）。
# 字段规范：字段值 = 真实数据（非骨架占位）；结构示例 = 注释示例行（下方 # 块，复制即用）。

已探索区域: {}   # 有 regions/ 时由 validate 对账派生全量镜像（大区→地点→子空间嵌套）；无 regions/ 时随叙事登记
# 已探索区域:
#   旧城区:                       # 大区/地点（任意层级·镜像目录树节点名）
#     类型: EXT                   # INT / EXT（从档案复制）
#     方位: 相对参照点的位置描述
#     连接: 可达区域名（逗号分隔，可指向未登记迷雾区）
#     发现于: S01                 # 首次到达的场景短 ID（未到达留空）
#     备注: '≤80字发现所得'
#     档案: regions/旧城区/REGION.md   # 完整路径指针（目录树同名节点必配·validate 核对存在性）
#     子区域:                     # 下层空间（层级键，可继续嵌套）
#       正街:
#         类型: EXT
#         方位: 东西主轴线
#         发现于: S01
