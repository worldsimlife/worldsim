# knowledge_index.yaml — 知情边界追踪索引（动态记录·可选）
# 规则全文见 references/knowledge_index.md；键表见 references/keys.md §knowledge_index.yaml
# 启用方式：收录第一条时若文件不存在 → 按本模板创建（触发式·不随 create_world 预置）
# 字段规范：字段值 = '[定义/约束]'（创建时替换为真实数据）；示例 = 行尾 # (例: …)
# 收录触发：①这个事实有知情差异吗（有人不知道/未被看见/是秘密）②事后还会被引用吗——①②都是「是」→ 收录一条
# 收录时机：关键节点（事实产生知情差异时·非逐轮）· 不参与 write-raw/FILE 体系·普通文件操作
# 一个世界 10-20 条封顶

知情事实:
  - 事实: '[一句话·只收录有知情差异的事实]' # (例: 黑衣人拿走旧照片·Dolores 没看见)
    轮次: '[系统层元数据·回退裁剪基准·永不模糊]' # (例: 25)
    时间: '[叙事时间·循环重置按联动表可模糊]' # (例: 第1日 14:20)
    记录: '[事实本体所在状态文件的指针·事实永远以状态文件为准·怎么查/怎么用见 references/knowledge_index.md]' # (例: CHAR_Dolores_state.记忆锚点 / scene_state.S05.场景时间线)
