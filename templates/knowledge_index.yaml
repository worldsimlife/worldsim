# worlds/{世界}/knowledge_index.yaml — 知情边界追踪索引（可选·纯数据）
# 规则全文见 references/knowledge_index.md
# 字段规范：本模板=数据条目模板——条目在注释示例行给出（复制即用）；收录字段：事实/轮次/时间/记录
#
# 收录：有知情差异的事实（谁知道了什么·谁知道谁不知道）
#       已公开无差异的事实不收录（scene_state/world_state 时间线已覆盖·避免双写）
# 字段：
#   事实 = 一句话（只收录有知情差异的事实）
#   轮次 = 系统层元数据·回退裁剪基准·永不模糊（与记忆锚点同构）
#   时间 = 叙事时间·循环重置按联动表可模糊
#   记录 = 事实本体所在状态文件的指针——事实永远以状态文件为准·本文件只做索引
#         （怎么查/怎么用不在此文件·归 references/knowledge_index.md）
# 收录时机：关键节点（事实产生知情差异时）· 检查时机：session 恢复 + /audit
# 一个世界 10-20 条封顶

