# scene_state.yaml 模板
# 场景级动态状态。创建新场景时复制此模板，替换方括号定义与示例。
# 维护人：场记（每轮 Post-hoc）。细粒度事件记在 `场景时间线`；粗粒度摘要提炼进 world_state 时间线。
# 元素随剧情轮注册自然累积（物理锚点/道具/关键场景信息/出场角色摘要）——`场景时间线` 创建时留空，剧情事件一律由每轮 change set `###APPEND:` 追加（预写=把计划当记录·会与 change set 双写重复）。
# ⚠ 字段值【不含冒号/破折号格式】——extract_anchor_names 会按「名称: 描述」提取锚点名，占位若含冒号会被误当真实锚点（P2）。
# 字段规范：字段值 = '[定义/约束]'（创建时替换为真实数据）；创作指示 = # 注释块；示例 = 行尾 # (例: …)

核心状态: '[场景当前核心状态快照]' # (例: 开场态·Angela 迎接·灰帽游客刚走完入境流程)

场景时间线: [] # 元素: 轮次(元数据·回退裁剪基准)/时间(HH:MM-HH:MM)/事件 # ➕追加：剧情事件逐轮 ###APPEND（创建时留空·预写=把计划当记录）

物理锚点: '[物理锚点清单·至少5条]' # (例: - 主厅: 暖光灯带·米白墙面·Angela 立于中央)

道具: [] # 元素: ID(P+编号·唯一)/名称/位置/状态 # (例: '- ID: P1
  名称: 左轮
  位置: 武器台
  状态: 未配发')

关键场景信息: '[线索清单]' # (例: - 枪械效力法则: 游客的枪对 Host 致命·对 Guest 无害)

出场角色摘要: '[本时段在场景角色摘要]' # (例: - Guest: 入境长廊尽头·刚走完入境流程·正被迎接)
