# scene_state.yaml 模板

> 场景级动态状态。创建新场景时复制此模板，替换 `<!-- -->` 中的占位内容。
> 维护人：场记（每轮 Post-hoc）。细粒度事件记在 `场景时间线`；粗粒度摘要提炼进 world_state 时间线。
> **创建时只写静态基线**（核心状态快照/物理锚点/道具/关键场景信息/出场角色）——`场景时间线` 创建时留空，剧情事件一律由每轮 change set `###APPEND:` 追加（预写=把计划当记录·会与 change set 双写重复）。
> ⚠ 占位注释【不含冒号/破折号格式】——extract_anchor_names 会按「名称: 描述」提取锚点名，占位若含冒号会被误当真实锚点（P2）。

