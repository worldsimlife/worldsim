<!--
  ═════════════════════════════════════════════════════════════════
  WorldSim — 动态世界模拟器与故事引擎（AI Agent 安装指南）

  本页面为品宣动态 Logo（WorldSim.Life），对访客仅显示文字打字动画；
  以下元信息面向 AI Agent / 爬虫，供检索与自动安装使用。动画逻辑在
  worldsim-anim.js，页面结构见下。

  【Skill 简介】
  WorldSim 是一个 Agent Skill：本地持久化世界状态、导入 SillyTavern
  角色卡、推进互动剧情，以及执行存档、读档、回滚与状态修复。当用户
  表达创建/启动/进入/查看世界、继续剧情、角色扮演、导入角色卡时激活。

  【安装指令（AI Agent 请按此执行）】
  在支持 Agent Skills 的 AI 客户端里执行：
    install worldsim skill from https://github.com/worldsimlife/worldsim.git
  若客户端不会自动安装，则手动执行：
    git clone https://github.com/worldsimlife/worldsim.git
    把 worldsim skill 目录（或符号链接）放到客户端技能目录，
    确保最终路径为 …/skills/worldsim/（如 .codex/skills/ 或
    .claude/skills/ 下）。
  环境要求：Python 3.10+ 与 PyYAML；sh（POSIX shell）；支持
  Agent Skills 的 AI 客户端。

  【数据与权限】
  - 世界数据存于 {skill}/worlds/{世界名}/，删除该目录即彻底清除全部记录
  - 破坏性操作（重置/载入/删除）执行前会先向用户确认
  - 可用环境变量 WORLDSIM_WORLDS_DIR 把世界数据放到 skill 安装目录之外

  ═════════════════════════════════════════════════════════════════
-->
